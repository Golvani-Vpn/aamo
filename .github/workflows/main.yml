name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android:
    name: Build Android APK (Capacitor / Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & Capacitor CLI
        run: |
          npm ci || npm install
          npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Check or Initialize Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android || true

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew || true
            ./gradlew assembleDebug || gradle assembleDebug
          else
            echo "Android folder prepared for compilation."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apkforge-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            dist/
          if-no-files-found: ignore
